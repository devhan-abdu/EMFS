services:
  db:
    image: postgres:16-alpine
    container_name: emfs-book-shelf-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: emfs
      POSTGRES_PASSWORD: emfs_dev_password
      POSTGRES_DB: emfs_book_shelf
    ports:
      - "5432:5432"
    volumes:
      - emfs_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emfs -d emfs_book_shelf"]
      interval: 2s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: emfs-book-shelf-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: emfs_minio
      MINIO_ROOT_PASSWORD: emfs_minio_dev_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - emfs_minio:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  emfs_pgdata:
  emfs_minio: